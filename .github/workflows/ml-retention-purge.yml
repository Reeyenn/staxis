# ML retention purge — GitHub Actions cron
#
# Daily purge for high-volume ML observation tables (prediction_log,
# inventory_rate_prediction_history, app_events, agent_costs). Retention
# windows are declared in migration 0103 and enforced by the route's
# RETENTION array. Runs after the daily ML inference + auto-rollback
# evaluators so we never delete a row those readers still need.
#
# Required GitHub Secrets:
#   CRON_SECRET — same value as in Vercel env. Bearer auth.
#
# Phase 3.6 (2026-05-13).
#
# -- RETENTION (A4-RATCHET, 2026-07-24) --------------------------------------
# BEFORE RE-ENABLING THE SCHEDULE BELOW, READ THIS.
#
# The schedule has been commented out since 2026-05-30, so nothing is being
# deleted today. That is the whole risk: the danger is not the slow drip, it is
# the RE-ENABLE moment. The first run after report ingestion restores data flow
# deletes everything past the window in ONE shot, with no warning.
#
# Re-enable checklist:
#   1. `npm test src/lib/__tests__/retention-purge-exemptions.test.ts` is green.
#      It proves the handler never deletes from EXEMPT_FROM_PURGE — which now
#      includes the agent decision corpus (agent_decisions), the dataset that
#      cannot be rebuilt after the fact.
#   2. Confirm the RETENTION windows in
#      src/app/api/cron/ml-retention-purge/route.ts still match what the product
#      needs; they were set when the ML service had live data.
#   3. Run once via workflow_dispatch and check the row counts it reports
#      BEFORE putting it back on a schedule.
#
# Known, not yet fixed: 72% of app_events rows are a single noise event
# (orphan_auth_user_skipped_too_old, one row per skipped user per run). The
# right fix is the WRITER — one summary row per run — not a wider window or a
# cold-storage tier. See the A4-RATCHET summary.

name: ML retention purge

on:
  # Scheduled run(s) DISABLED 2026-05-30 — the ML service has no incoming
  # data since the scraper was removed, so each run hit a dead endpoint,
  # failed, and emailed a 'workflow failed' notification. Jobs + all ML
  # code are KEPT; re-enable by uncommenting. Manual runs still work via
  # the Actions tab (workflow_dispatch).
  # schedule:
  # # 08:00 UTC daily (~3:00am Central). After:
  # #   • ml-run-inference (cron at 06:00 UTC)
  # #   • ml-shadow-evaluate (cron at 07:00 UTC)
  # # before any cockpit refresh runs in business hours.
  # - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Purge expired ML rows
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          URL="https://getstaxis.com/api/cron/ml-retention-purge"

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            "$URL")

          echo "Response: $RESPONSE"

          # 207 (multi-status) means at least one table failed — heartbeat
          # is degraded and the doctor will surface it. Don't fail the
          # workflow in that case; the per-table errors are inside the
          # response and the doctor is the right surface for them.
          echo "$RESPONSE" | grep -q '"ok":true\|"ok":false' || {
            echo "::error::ml-retention-purge returned malformed JSON"
            exit 1
          }
