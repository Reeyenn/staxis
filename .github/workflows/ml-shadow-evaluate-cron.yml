# ML shadow-evaluate cron — promote or rollback shadow models after 7-day soak
#
# Companion to the weekly training cron. When inventory training re-fits an
# item that already has a graduated active model, the new fit lands as a
# shadow run (is_shadow=true, is_active=false). After 7 days, this cron
# decides whether to promote (replace the active) or reject (mark the
# shadow ended, leave the active in place). See
# /api/cron/ml-shadow-evaluate route header for the full design.
#
# Required GitHub Secret: CRON_SECRET — matches Vercel env.

name: ML shadow evaluate

on:
  # Scheduled run(s) DISABLED 2026-05-30 — the ML service has no incoming
  # data since the scraper was removed, so each run hit a dead endpoint,
  # failed, and emailed a 'workflow failed' notification. Jobs + all ML
  # code are KEPT; re-enable by uncommenting. Manual runs still work via
  # the Actions tab (workflow_dispatch).
  # schedule:
  # # 11:30 UTC daily — well after the weekly retrain crons (Sunday 08:00 UTC)
  # # so any shadow from the latest retrain has the freshest soak start
  # # timestamp before today's evaluation pass runs.
  # - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    # THE ROUTE THIS CALLS NO LONGER EXISTS (/api/cron/ml-shadow-evaluate was
    # removed with the rest of the housekeeping ML surface; the job catalog
    # carries this workflow as `retired`). The workflow and its history are
    # kept, but a manual run could only ever end red on a 404 from a page that
    # was deleted, which teaches an operator that a red Actions run is normal.
    # Put the route back and delete this guard in the same change.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run shadow-evaluate pass
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          URL="https://getstaxis.com/api/cron/ml-shadow-evaluate"

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            "$URL")

          echo "$RESPONSE" | tee /tmp/result.json

          # Tighter check (May 2026 audit): the route returns ok:true even
          # when individual shadow evaluations errored — silent-success
          # bug class. Fail the workflow when any per-shadow verdict is
          # "error". 'promoted' and 'rejected' are both valid outcomes;
          # only 'error' means we couldn't reach a verdict.
          jq -e '
            (.ok == true) and
            ((.results // []) | map((.verdict // "ok") != "error") | all)
          ' /tmp/result.json
