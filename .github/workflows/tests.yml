name: Tests

# Runs on every push to main and every PR. Independent suites/checks run in
# parallel; the final `test` job preserves the one required aggregate status.
#
# Order within a job remains intentional: setup precedes the checks that need
# it, while unrelated root, ML, CUA, email-worker, and build jobs do not wait
# on one another.
#
# 2026-05-12 (Codex audit): pin permissions to the minimum needed.
# The default GITHUB_TOKEN scope on PR runs depends on org/repo
# settings; if defaults are permissive, an untrusted PR's code (run
# via `npm ci` + `npm run build`) could exfiltrate a token with
# write access. These jobs only need to read the checked-out code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The independent root checks share no artifacts or mutable state. Keeping
  # the full-history checkout here is load-bearing for audit-eval-regressions:
  # it compares this event's commit range and must not pass vacuously on a
  # shallow clone.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Lint — ESLint flat config (eslint.config.js) bridged to
      # eslint-config-next via FlatCompat. The cosmetic
      # react/no-unescaped-entities rule is disabled project-wide.
      # `--max-warnings 0` means ANY warning fails the build — keeps
      # the codebase from drifting back into the noisy state.
      # Also runs scripts/check-env-access.mjs — fails CI if any file
      # outside the canonical env modules (src/lib/env.ts etc.) reads
      # process.env directly. Forces new code to import { env }.
      - name: Lint
        run: npm run lint

      # Audit Batch 1 (NEW-1): block Finder-style duplicates from ever
      # shipping a workflow file. macOS creates `foo 2.yml` when copying
      # `foo.yml` onto an existing target; if a parallel session does
      # this and the dup is committed, GitHub Actions schedules both.
      # The original `scraper-health-cron 2.yml` / `sms-jobs-cron 2.yml`
      # incident was exactly this. The find is anchored to .github/
      # workflows but the principle extends; if more duplicates appear
      # anywhere in the tree, surface them in the warn channel.
      - name: Block duplicate workflow basenames
        run: |
          set -euo pipefail
          dups=$(find .github/workflows -type f \( -name '* 2.yml' -o -name '* 2.yaml' -o -name '* copy.yml' \) 2>/dev/null)
          if [ -n "$dups" ]; then
            echo "::error::Finder-style duplicate workflow files found. Delete them — they fire alongside the canonical files."
            echo "$dups"
            exit 1
          fi
          echo "No duplicate workflow files."

  # This is the complete root npm test contract. It intentionally runs as one
  # logical suite so package.json remains the source of truth: type-check and
  # PII guard, all server/integration *.test.ts files, and the client-behavior
  # *.client.test.tsx glob. The latter automatically includes every matching
  # future file; no hand-maintained allowlist can silently omit a new test.
  root-tests:
    runs-on: ubuntu-latest
    # The complete npm test contract (server, integration, and serialized client suites)
    # now needs more than the previous ceiling on a clean runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run complete npm test contract
        run: npm test

  # ML checks have a separate Python dependency boundary and do not depend on
  # the root JavaScript checks. They therefore run concurrently with them.
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Phase M3.1 (2026-05-14): Python toolchain for ml-service.
      # Adding pytest to CI was the missing root-cause gate that let two
      # NameError/AttributeError cold-start crashes ship in M3 — the test
      # suite existed locally but never ran in CI. Setup is cached on
      # requirements.txt so this only re-installs when deps change.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ml-service deps
        working-directory: ml-service
        run: pip install -r requirements.txt

      # Phase M3.1 (2026-05-14): static check for undefined names. F821
      # would have caught the demand.py:214 NameError on `property_meta`
      # at PR-open time without needing any test. Cheap defense in depth.
      # Scope narrowed to src/ — pre-existing type debt elsewhere does
      # not block this gate.
      - name: Static check ml-service (ruff F821 — undefined names)
        working-directory: ml-service
        run: |
          pip install ruff
          ruff check src/ --select F821

      # Phase M3.1: Python tests gate. The actual root-cause fix for the
      # M3 cold-start ship-blockers — they slipped because pytest never
      # ran in CI. Placeholder env vars keep get_settings() from failing
      # at module import inside transitively-imported src/* code. Tests
      # don't make real network/DB calls (mock supabase wrapper).
      - name: Run ml-service tests
        working-directory: ml-service
        env:
          SUPABASE_URL: 'https://placeholder.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-role-key'
          ML_SERVICE_SECRET: 'placeholder-secret-12345'
        run: python -m pytest -v --tb=short

      # Codex round-5 META J1.4 (2026-05-13): warn on overgrown ML files.
      # This remains a soft warning, as it was in the serial workflow.
      - name: Warn on oversized ML files
        run: |
          THRESHOLD=600
          # Use NUL-delimited find output so an unusual filename cannot split
          # the warning scan into a different file/argument.
          OVERSIZED=$(while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            [ "$lines" -gt "$THRESHOLD" ] && printf '%s %s\n' "$lines" "$file"
          done < <(find ml-service/src src/lib/db src/app/api/cron/ml-* \
            \( -name '*.py' -o -name '*.ts' \) -type f -print0 2>/dev/null) \
            | sort -rn || true)
          if [ -n "$OVERSIZED" ]; then
            echo "$OVERSIZED" | while IFS=' ' read -r lines file; do
              echo "::warning file=${file},line=1::ML file is ${lines} lines (>${THRESHOLD}). Extract a module before adding more logic — see Phase J in the plan history."
            done
          else
            echo "All ML files are under ${THRESHOLD} lines. ✓"
          fi

  # CUA retains its own install, lint, browser-backed tests, and build
  # contract. It is independent of the root and Python jobs.
  cua:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cua-service/package-lock.json

      # deploy-ci-cron Step 4 (2026-05-22): cua-service had no CI coverage.
      # A TypeScript regression in the Fly worker only surfaced at deploy
      # time, after a hotel onboarding job had already been queued. These
      # steps run inside cua-service/ so lint, tests, and build catch
      # regressions at PR-open time.
      - name: Install cua-service deps
        working-directory: cua-service
        run: npm ci

      - name: Lint cua-service
        working-directory: cua-service
        run: npm run lint

      # The dom-rows self-heal tests drive real Playwright pages; the hosted
      # runner has no browser cache, so install the chromium shell first or
      # every browser-backed subtest dies with "Executable doesn't exist".
      - name: Install Playwright chromium for cua-service tests
        working-directory: cua-service
        run: npx playwright install --with-deps chromium

      - name: Test cua-service
        working-directory: cua-service
        run: npm test

      - name: Build cua-service
        working-directory: cua-service
        run: npm run build

  # The Cloudflare email worker has its own package boundary and TypeScript
  # config, so the root type-check cannot validate it.
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: email-worker/package-lock.json

      - name: Install email-worker deps
        working-directory: email-worker
        run: npm ci

      - name: Type-check email-worker
        working-directory: email-worker
        run: npm run typecheck

  # The app build shares no mutable state with tests, lint, ML, CUA, or the
  # email worker, so it can consume its own runner concurrently.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Final guard: actually build the app. Catches Next.js bundler errors
      # (missing client/server boundaries, dynamic-import paths, etc.) that
      # tsc happily ignores. Without this, a "type-clean" PR can still break
      # production. Placeholders keep env validation from blocking the build.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key-min-20-chars'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-role-key-min-20-chars'
          OPENAI_API_KEY: 'sk-placeholder-test-key-min-20-chars'
        run: npm run build

  # Keep the protected-branch context named `test`. This job is deliberately
  # always evaluated after every independent job so a failed, cancelled, or
  # skipped dependency cannot leave the required aggregate check green.
  test:
    if: ${{ always() }}
    needs: [quality, root-tests, ml, cua, email, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Tests workflow job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          ROOT_TESTS_RESULT: ${{ needs.root-tests.result }}
          ML_RESULT: ${{ needs.ml.result }}
          CUA_RESULT: ${{ needs.cua.result }}
          EMAIL_RESULT: ${{ needs.email.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          failed=0
          results=(
            "quality=${QUALITY_RESULT}"
            "root-tests=${ROOT_TESTS_RESULT}"
            "ml=${ML_RESULT}"
            "cua=${CUA_RESULT}"
            "email=${EMAIL_RESULT}"
            "build=${BUILD_RESULT}"
          )
          for result in "${results[@]}"; do
            job=${result%%=*}
            status=${result#*=}
            if [ "$status" = success ]; then
              echo "${job}: passed"
            else
              echo "::error::${job} ended with ${status}; required test gate fails."
              failed=1
            fi
          done
          exit "$failed"
