# Staxis PMS report inbox — Cloudflare Email Worker.
#
# Bound as the catch-all destination for Email Routing on the getstaxis.com apex.
# Deploy:  npm install && npx wrangler deploy
# Secret:  npx wrangler secret put PMS_INBOX_WEBHOOK_SECRET   (same value as Vercel env)
# Then in the Cloudflare dashboard: Email → Email Routing → Routing rules →
#   Catch-all → Send to a Worker → staxis-pms-inbox.

name = "staxis-pms-inbox"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Email-triggered only (Email Routing catch-all) — no HTTP route, so don't
# require a workers.dev subdomain.
workers_dev = false

# Non-secret vars. WEBHOOK_URL points at the live webhook (override to a Vercel
# preview URL during end-to-end testing). PMS_INBOX_WEBHOOK_SECRET is a SECRET —
# set it with `wrangler secret put`, never here.
[vars]
WEBHOOK_URL = "https://getstaxis.com/api/pms-inbox/inbound"
# Phase two of the attachment handshake. Defaults to WEBHOOK_URL with
# /inbound swapped for /attachment-commit; set explicitly only if they diverge.
COMMIT_URL = "https://getstaxis.com/api/pms-inbox/attachment-commit"
# 25 MiB — Cloudflare Email Routing's own message ceiling. Raised from 256 KiB
# so scheduled PMS report emails (CSV/PDF/XLSX attachments) survive the hop.
# Must stay <= the pms-raw bucket's file_size_limit (migration 0340).
MAX_BYTES = "26214400"
# Trusted receiver authserv-id(s). Only the Authentication-Results header added
# by a matching receiver is believed. Confirm Cloudflare's actual authserv-id
# with `wrangler tail` on a real inbound message and set it exactly if it isn't
# a *.cloudflare.net value.
TRUSTED_AUTHSERV_IDS = "cloudflare.net"
